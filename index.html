    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: #f2f2f7;
            padding: 20px 10px;
        }

        .title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0 20px;
            color: #1c1c1e;
        }

        /* grouplabel */
        .tab-bar {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 10px 5px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .tab-bar::-webkit-scrollbar {display: none;}

        .tab {
            padding: 12px 20px;
            background: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .tab.active {
            background: #007AFF;
            color: #fff;
        }

        .card-group {
            display: none;
            max-width: 340px;
            margin: 0 auto;
            gap: 15px;
            flex-direction: column;
        }
        .card-group.active {
            display: flex;
        }

        .card {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .card:active {transform: scale(0.97);}
        .card img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            display: block;
        }

        /* ———— tool card ———— */
        .tool-card {
            position: relative;
            width: 100%;
            aspect-ratio: 2.5/3.5; 
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
            cursor: pointer;
        }
        .tool-card.flip {
            transform: rotateY(180deg);
        }
        .tool-front, .tool-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 20px;
        }
        .tool-front {
            transform: rotateY(180deg);
        }
        .tool-front img, .tool-back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        /* ———— BLANK CARD ———— */
        .blank-card {
            position: relative;
            width: 100%;
            aspect-ratio: 2.5/3.5;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .blank-card img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        .blank-input {
            position: absolute;
            left: 2%;
            bottom: 0;
            width: 100%;
            height: 45%; 
            padding: 20px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 16px;
            color: #000;
            resize: none;
            user-select: text;
            font-family: system-ui;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .modal img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            touch-action: pinch-zoom;
        }
        .close {
            position: fixed;
            top: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            color: white;
            font-size: 40px;
            text-align: center;
            line-height: 60px;
            z-index: 1000;
        }
    </style>

    <script>
        // 切换分组
        function switchTab(num) {
            // 隐藏所有
            document.querySelectorAll('.card-group').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            // 显示当前
            document.getElementById('group'+num).classList.add('active');
            document.querySelectorAll('.tab')[num-1].classList.add('active');
        }

        // 工具卡翻面
        function flipCard(el) {
            el.classList.toggle('flip');
        }

        function showCard(url) {
            document.getElementById('showImg').src = url;
            document.getElementById('cardModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        // 关闭弹窗
        function closeCard() {
            document.getElementById('cardModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // 点击空白关闭
        document.getElementById('cardModal').onclick = function(e) {
            if(e.target === this) closeCard();
        }

        // 空白卡临时保存
        function saveTempText() {
            let text = document.getElementById('blankInput').value;
            localStorage.setItem('cardTempText', text);
        }
        window.onload = function() {
            let tempText = localStorage.getItem('cardTempText');
            if(tempText) {
                document.getElementById('blankInput').value = tempText;
            }
        }
