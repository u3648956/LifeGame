<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>卡牌钱包</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: #f2f2f7;
            padding: 30px 15px;
        }

        .title {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #1c1c1e;
        }

        /* 卡牌容器 */
        .card-stack {
            position: relative;
            max-width: 340px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 卡牌样式：打开就可见，不遮挡！ */
        .card {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .card:active {
            transform: scale(0.97);
        }

        .card img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            display: block;
        }

        /* 全屏弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .modal img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            touch-action: pinch-zoom;
        }

        .close {
            position: fixed;
            top: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            color: white;
            font-size: 40px;
            text-align: center;
            line-height: 60px;
            z-index: 1000;
        }
    </style>
</head>

<body>
    <h1 class="title">卡牌钱包</h1>

    <!-- 所有卡牌打开直接显示，无遮挡 -->
    <div class="card-stack">
        <div class="card" onclick="showCard('images/1.png')">
            <img src="images/card1.jpg">
        </div>
        <div class="card" onclick="showCard('images/2.png')">
            <img src="images/card2.jpg">
        </div>
        <div class="card" onclick="showCard('images/3.png')">
            <img src="images/card3.jpg">
        </div>
        <div class="card" onclick="showCard('images/4.png')">
            <img src="images/card4.jpg">
        </div>
    </div>

    <!-- 全屏查看 -->
    <div class="modal" id="cardModal">
        <div class="close" onclick="closeCard()">×</div>
        <img id="showImg">
    </div>

    <script>
        function showCard(url) {
            document.getElementById('showImg').src = url;
            document.getElementById('cardModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeCard() {
            document.getElementById('cardModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        document.getElementById('cardModal').onclick = function(e) {
            if(e.target === this) closeCard();
        }
    </script>
</body>
</html>
